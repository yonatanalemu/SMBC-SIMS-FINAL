server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers — applied to all responses from this server block
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    # HSTS only matters once you're serving over HTTPS (e.g. behind a TLS-terminating
    # reverse proxy on the VPS) — uncomment when that's in place:
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # SPA routing — any unmatched path falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API — frontend calls /api/* which gets forwarded to the
    # backend service (same-origin from the browser's perspective, no CORS).
    location /api/ {
        proxy_pass http://backend:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m; # exam PDFs / payment screenshots
    }

    # Uploaded files (exam PDFs, payment screenshots, news images, etc.)
    location /uploads/ {
        proxy_pass http://backend:4000/uploads/;
        proxy_http_version 1.1;
    }

    # Folder-dropped content (curriculum PDFs, certificate template PNGs)
    location /content/ {
        proxy_pass http://backend:4000/content/;
        proxy_http_version 1.1;
    }
}